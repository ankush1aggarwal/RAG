# Local API container: mount your Qdrant data dir and point Ollama at the host.
# Usage: copy .env.example -> .env, then: docker compose up --build

services:
  api:
    build: .
    image: fiqa-production-rag:local
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: ${API_PORT:-8000}
      QDRANT_PATH: /data/qdrant
      # Optional: override to download models at runtime instead of using the image bake:
      # HF_HOME: /data/hf_cache
      HF_HOME: /app/.cache/huggingface
      TRANSFORMERS_CACHE: /app/.cache/huggingface
      HUGGINGFACE_HUB_CACHE: /app/.cache/huggingface
      # Reach Ollama on the host from inside the container (Docker Desktop / Linux 20.10+).
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      - ${QDRANT_HOST_PATH:-./data/qdrant_local}:/data/qdrant:ro
      - hf_cache:/data/hf_cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('PORT', '8000') + '/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3

volumes:
  hf_cache:
